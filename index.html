<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Family Feud - SAGES Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial Black', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
        }
        
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .title {
            font-size: 3em;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }
        
        .question {
            font-size: 1.8em;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .answers-board {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .answer-slot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #FFD700;
            color: #000;
            margin: 10px 0;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.5em;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            min-height: 60px;
        }
        
        .answer-slot.hidden {
            background: #333;
            color: #666;
        }
        
        .answer-slot.hidden .answer-text {
            visibility: hidden;
        }
        
        .answer-slot.hidden .answer-points {
            visibility: hidden;
        }
        
        .answer-rank {
            font-size: 2em;
            margin-right: 15px;
            min-width: 40px;
        }
        
        .answer-text {
            flex-grow: 1;
            text-align: left;
        }
        
        .answer-points {
            font-size: 1.2em;
            min-width: 50px;
            text-align: right;
        }
        
        .scores {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        
        .team-score {
            background: rgba(255,255,255,0.2);
            padding: 20px 40px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.5em;
        }
        
        .team-name {
            font-size: 0.8em;
            margin-bottom: 10px;
        }
        
        .score-value {
            font-size: 2em;
            font-weight: bold;
        }
        
        .no-questions {
            text-align: center;
            padding: 100px 20px;
            font-size: 2em;
            color: rgba(255,255,255,0.7);
        }
        
        .no-questions-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .connected {
            background: rgba(76, 175, 80, 0.8);
        }
        
        .disconnected {
            background: rgba(244, 67, 54, 0.8);
        }
        
        .loading {
            background: rgba(255, 193, 7, 0.8);
        }
        
        .game-board {
            display: none;
        }
        
        .game-board.visible {
            display: block;
        }
        
        @media (max-width: 768px) {
            .title { font-size: 2em; }
            .question { font-size: 1.4em; }
            .answer-slot { font-size: 1.2em; }
            .answer-rank { font-size: 1.5em; }
            .no-questions { font-size: 1.5em; padding: 50px 20px; }
        }
        
        /* Enhanced display elements */
        .game-phase-indicator {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #FFC107;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .phase-text {
            font-size: 1.2em;
            color: #FFC107;
            font-weight: bold;
        }
        
        .strikes-display {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .strikes-text {
            font-size: 1.1em;
            color: #f44336;
            font-weight: bold;
        }
        
        .buzz-results-display {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .buzz-winner-text {
            font-size: 1.3em;
            color: #4CAF50;
            font-weight: bold;
        }
        
        .countdown-display {
            background: rgba(255, 193, 7, 0.3);
            border: 2px solid #FFC107;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .countdown-timer {
            font-size: 4em;
            color: #FFC107;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .countdown-text {
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #FFC107;
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connection-status">Connecting...</div>
    
    <div class="game-container">
        <div class="header">
            <h1 class="title">RESIDENT FAMILY FEUD</h1>
        </div>
        
        <!-- No Questions State -->
        <div class="no-questions" id="no-questions">
            <div class="no-questions-icon">🎯</div>
            <div>Waiting for questions...</div>
        </div>
        
        <!-- Game Board (hidden until questions loaded) -->
        <div class="game-board" id="game-board">
            <!-- Game Phase Indicator -->
            <div class="game-phase-indicator" id="phase-indicator" style="display: none;">
                <div class="phase-text" id="phase-text">Game Setup</div>
            </div>
            
            <!-- Countdown Display -->
            <div class="countdown-display" id="countdown-display" style="display: none;">
                <div class="countdown-text">Get Ready!</div>
                <div class="countdown-timer" id="countdown-timer">3</div>
            </div>
            
            <!-- Buzz Results -->
            <div class="buzz-results-display" id="buzz-results" style="display: none;">
                <div class="buzz-winner-text" id="buzz-winner">Team 1 buzzed first!</div>
            </div>
            
            <!-- Strikes Display -->
            <div class="strikes-display" id="strikes-display" style="display: none;">
                <div class="strikes-text" id="strikes-text">Team 1: ⚡⚡⚡ (3 strikes)</div>
            </div>
            
            <div class="question" id="current-question">Loading...</div>
            
            <div class="scores">
                <div class="team-score">
                    <div class="team-name" id="team1-display-name">TEAM 1</div>
                    <div class="score-value" id="team1-score">0</div>
                </div>
                <div class="team-score">
                    <div class="team-name" id="team2-display-name">TEAM 2</div>
                    <div class="score-value" id="team2-score">0</div>
                </div>
            </div>
            
            <div class="answers-board" id="answers-board">
                <!-- Answers will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBI0FZRNrYyCjVWic6YEMmZ_bbHE4IAhcY",
            authDomain: "resident-family-feud.firebaseapp.com",
            databaseURL: "https://resident-family-feud-default-rtdb.firebaseio.com",
            projectId: "resident-family-feud",
            storageBucket: "resident-family-feud.firebasestorage.app",
            messagingSenderId: "895685579158",
            appId: "1:895685579158:web:1267859ee412bfe453cdb7"
        };

        // Initialize Firebase
        let database;
        let isConnected = false;
        
        try {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            
            // Monitor connection status
            const connectedRef = database.ref(".info/connected");
            connectedRef.on("value", (snap) => {
                isConnected = snap.val();
                updateConnectionStatus();
            });
            
            console.log("Firebase initialized");
        } catch (error) {
            console.log("Firebase not configured, using local mode");
            updateConnectionStatus();
        }

        // DISPLAY STATE - minimal cached data for building UI
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let revealedAnswers = {};
        let countdownInterval = null;

        function updateConnectionStatus() {
            const statusEl = document.getElementById('connection-status');
            if (database && isConnected) {
                statusEl.textContent = 'Connected';
                statusEl.className = 'connection-status connected';
            } else if (database && !isConnected) {
                statusEl.textContent = 'Connecting...';
                statusEl.className = 'connection-status loading';
            } else {
                statusEl.textContent = 'Offline';
                statusEl.className = 'connection-status disconnected';
            }
        }

        function showGameBoard() {
            document.getElementById('no-questions').style.display = 'none';
            document.getElementById('game-board').classList.add('visible');
        }

        function hideGameBoard() {
            document.getElementById('no-questions').style.display = 'block';
            document.getElementById('game-board').classList.remove('visible');
        }

        function rebuildAnswersBoard() {
            const answersBoard = document.getElementById('answers-board');
            answersBoard.innerHTML = '';
            
            if (!currentQuestions[currentQuestionIndex] || !currentQuestions[currentQuestionIndex].answers) {
                return;
            }
            
            const currentQ = currentQuestions[currentQuestionIndex];
            currentQ.answers.forEach((answer, index) => {
                const answerSlot = document.createElement('div');
                const key = `q${currentQuestionIndex}_a${index}`;
                const isRevealed = revealedAnswers[key] || false;
                
                answerSlot.className = `answer-slot ${isRevealed ? '' : 'hidden'}`;
                answerSlot.innerHTML = `
                    <div class="answer-rank">${answer.rank || (index + 1)}</div>
                    <div class="answer-text">${answer.text || 'Unknown Answer'}</div>
                    <div class="answer-points">${answer.points || 0}</div>
                `;
                
                answersBoard.appendChild(answerSlot);
            });
        }

        function initializeGame() {
            if (!database) {
                hideGameBoard();
                return;
            }

            // Listen for question set changes - show/hide game board
            database.ref('questionSet').on('value', (snapshot) => {
                if (snapshot.exists() && snapshot.val().questions && snapshot.val().questions.length > 0) {
                    currentQuestions = snapshot.val().questions;
                    showGameBoard();
                    rebuildAnswersBoard();
                } else {
                    currentQuestions = [];
                    hideGameBoard();
                }
            });

            // DIRECT FIREBASE-TO-DOM UPDATES - no local state management

            // Current question index and text
            database.ref('gameState/currentQuestion').on('value', (snapshot) => {
                currentQuestionIndex = snapshot.val() || 0;
                const questionText = currentQuestions[currentQuestionIndex]?.question || 'Loading...';
                document.getElementById('current-question').textContent = questionText;
                rebuildAnswersBoard(); // Rebuild when question changes
            });

            // Revealed answers
            database.ref('gameState/revealedAnswers').on('value', (snapshot) => {
                revealedAnswers = snapshot.val() || {};
                rebuildAnswersBoard(); // Rebuild when answers change
            });

            // Team names
            database.ref('teams/team1/name').on('value', (snapshot) => {
                document.getElementById('team1-display-name').textContent = snapshot.val() || 'TEAM 1';
            });
            
            database.ref('teams/team2/name').on('value', (snapshot) => {
                document.getElementById('team2-display-name').textContent = snapshot.val() || 'TEAM 2';
            });

            // Scores
            database.ref('gameState/team1Score').on('value', (snapshot) => {
                document.getElementById('team1-score').textContent = snapshot.val() || 0;
            });
            
            database.ref('gameState/team2Score').on('value', (snapshot) => {
                document.getElementById('team2-score').textContent = snapshot.val() || 0;
            });

            // Game phase display
            database.ref('gameState/phase').on('value', (snapshot) => {
                const phase = snapshot.val() || 'setup';
                updatePhaseDisplay(phase);
            });

            // Buzzer results
            database.ref('buzzer/firstBuzz').on('value', (snapshot) => {
                if (snapshot.exists()) {
                    const buzz = snapshot.val();
                    showBuzzResults(buzz);
                } else {
                    hideBuzzResults();
                }
            });

            // Strikes display
            database.ref('gameState/strikes').on('value', (snapshot) => {
                const strikes = snapshot.val() || 0;
                updateStrikesDisplay(strikes);
            });

            // Controlling team (for strikes display)
            database.ref('buzzer/controllingTeam').on('value', (snapshot) => {
                const controllingTeam = snapshot.val();
                updateStrikesDisplay(null, controllingTeam);
            });

            // Countdown
            database.ref('countdown').on('value', (snapshot) => {
                if (snapshot.exists() && snapshot.val().active) {
                    showCountdown(snapshot.val().timeLeft);
                } else {
                    hideCountdown();
                }
            });
        }

        function updatePhaseDisplay(phase) {
            let phaseText = '';
            let showPhase = true;

            switch (phase) {
                case 'setup':
                    showPhase = false;
                    break;
                case 'faceoff':
                    phaseText = 'Face-off in Progress';
                    break;
                case 'countdown':
                    phaseText = 'Get Ready!';
                    break;
                case 'buzzer_active':
                    phaseText = 'BUZZER ACTIVE!';
                    break;
                case 'main_game':
                    phaseText = 'Team Playing';
                    break;
                case 'steal':
                    phaseText = 'Steal Opportunity';
                    break;
                case 'round_over':
                    phaseText = 'Round Complete';
                    break;
                default:
                    showPhase = false;
            }

            if (showPhase) {
                document.getElementById('phase-text').textContent = phaseText;
                document.getElementById('phase-indicator').style.display = 'block';
            } else {
                document.getElementById('phase-indicator').style.display = 'none';
            }
        }

        function showBuzzResults(buzz) {
            // Get team names directly from DOM (already updated by Firebase listeners)
            const team1Name = document.getElementById('team1-display-name').textContent;
            const team2Name = document.getElementById('team2-display-name').textContent;
            
            const winnerName = buzz.team === 1 ? team1Name : team2Name;
            document.getElementById('buzz-winner').textContent = `${winnerName} buzzed first!`;
            document.getElementById('buzz-results').style.display = 'block';
        }

        function hideBuzzResults() {
            document.getElementById('buzz-results').style.display = 'none';
        }

        // Keep track of strikes and controlling team for display
        let currentStrikes = 0;
        let currentControllingTeam = null;

        function updateStrikesDisplay(strikes, controllingTeam) {
            // Update stored values if provided
            if (strikes !== null && strikes !== undefined) currentStrikes = strikes;
            if (controllingTeam !== null && controllingTeam !== undefined) currentControllingTeam = controllingTeam;

            if (currentStrikes > 0 && currentControllingTeam) {
                // Get team name directly from DOM
                const team1Name = document.getElementById('team1-display-name').textContent;
                const team2Name = document.getElementById('team2-display-name').textContent;
                const teamName = currentControllingTeam === 1 ? team1Name : team2Name;
                
                const strikeSymbols = '⚡'.repeat(currentStrikes);
                document.getElementById('strikes-text').textContent = 
                    `${teamName}: ${strikeSymbols} (${currentStrikes} strike${currentStrikes > 1 ? 's' : ''})`;
                document.getElementById('strikes-display').style.display = 'block';
            } else {
                document.getElementById('strikes-display').style.display = 'none';
            }
        }

        function showCountdown(timeLeft) {
            hideCountdown(); // Clear any existing countdown
            
            document.getElementById('countdown-timer').textContent = timeLeft;
            document.getElementById('countdown-display').style.display = 'block';
            
            countdownInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('countdown-timer').textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    hideCountdown();
                }
            }, 1000);
        }

        function hideCountdown() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            document.getElementById('countdown-display').style.display = 'none';
        }

        // Initialize the game when page loads
        document.addEventListener('DOMContentLoaded', initializeGame);
    </script>
</body>
</html>
