<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Family Feud - SAGES Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --team1-color: #2196F3;
            --team2-color: #FF9800;
            --team1-secondary: #1976D2;
            --team2-secondary: #F57C00;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial Black', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
        }
        
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .game-board {
            position: relative;
            padding-top: 20px; /* Reduced padding since scores are now fixed */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .title {
            font-size: 3em;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }
        
        .question {
            position: fixed;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            height: 140px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px 15px 0 0;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            z-index: 6;
            
            /* CSS Grid centering */
            display: grid;
            place-items: center;
            text-align: center;
            padding: 20px 30px;
            
            /* Typography */
            font-size: 1.8em;
            line-height: 1.3;
            font-weight: 500;
            
            /* Overflow handling */
            overflow: hidden;
            box-sizing: border-box;
        }
        
        .answers-board {
            position: fixed;
            top: 260px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            height: calc(100vh - 286px);
            background: rgba(0,0,0,0.3);
            border-radius: 0 0 15px 15px;
            z-index: 4;
            
            /* Content styling */
            padding: 20px;
            overflow-y: auto;
            
            /* Use CSS Grid to auto-fit answers */
            display: grid;
            grid-template-rows: repeat(var(--answer-count), 1fr);
            gap: 5px;
            
            /* Ensure answers fit properly */
            box-sizing: border-box;
        }
        
        .answer-slot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #FFD700;
            color: #000;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            /* Grid will handle sizing automatically */
            min-height: 0;
            font-size: 1.5em;
        }
        
        .answer-slot.hidden {
            background: #333;
            color: #666;
        }
        
        .answer-slot.hidden .answer-text {
            visibility: hidden;
        }
        
        .answer-slot.hidden .answer-points {
            visibility: hidden;
        }
        
        .answer-rank {
            font-size: 2em;
            margin-right: 15px;
            min-width: 40px;
        }
        
        .answer-text {
            flex-grow: 1;
            text-align: left;
        }
        
        .answer-points {
            font-size: 1.2em;
            min-width: 50px;
            text-align: right;
        }
        
        .scores {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none; /* Allow clicks to pass through */
        }
        
        .team-score {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 20px 25px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.4em;
            min-width: 180px;
            max-width: 220px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.5s ease, transform 0.3s ease;
            pointer-events: auto; /* Re-enable clicks on score boxes */
        }
        
        /* Team-specific styling with dynamic colors */
        #team1-score-box {
            border-color: var(--team1-color);
        }
        
        #team2-score-box {
            border-color: var(--team2-color);
        }
        
        .team-name {
            font-size: 0.8em;
            margin-bottom: 8px;
            opacity: 0.9;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        #team1-score-box .team-name {
            color: var(--team1-color);
        }
        
        #team2-score-box .team-name {
            color: var(--team2-color);
        }
        
        .score-value {
            font-size: 2em;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        #team1-score-box .score-value {
            color: var(--team1-color);
        }
        
        #team2-score-box .score-value {
            color: var(--team2-color);
        }
        
        /* Dynamic question font sizing */
        .question.short { font-size: 2.8em; }     /* < 50 chars */
        .question.medium { font-size: 2.2em; }    /* 50-100 chars */
        .question.long { font-size: 1.8em; }      /* 100+ chars */
        .team-score.controlling-team {
            transform: scale(1.03);
            animation: controllingTeamPulse 3s ease-in-out infinite;
            border-width: 3px !important;
        }
        
        @keyframes controllingTeamPulse {
            0%, 100% { 
                transform: scale(1.03); 
            }
            50% { 
                transform: scale(1.06); 
            }
        }
        
        .team-strikes {
            margin-top: 8px;
            padding: 4px 8px;
            background: rgba(244, 67, 54, 0.15);
            border-radius: 8px;
            border: 1px solid rgba(244, 67, 54, 0.3);
            min-height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        
        .team-strikes.empty {
            opacity: 0.3;
            background: rgba(128, 128, 128, 0.1);
            border: 1px solid rgba(128, 128, 128, 0.2);
        }
        
        .team-strikes .strikes-text {
            font-size: 1.2em;
            color: #f44336;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        
        .team-strikes.empty .strikes-text {
            color: rgba(128, 128, 128, 0.5);
        }
        
        .no-questions {
            text-align: center;
            padding: 100px 20px;
            font-size: 2em;
            color: rgba(255,255,255,0.7);
        }
        
        .no-questions-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .connection-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: bold;
            z-index: 100;
        }
        
        .connected {
            background: rgba(76, 175, 80, 0.8);
        }
        
        .disconnected {
            background: rgba(244, 67, 54, 0.8);
        }
        
        .loading {
            background: rgba(255, 193, 7, 0.8);
        }
        
        .game-board {
            display: none;
        }
        
        .game-board.visible {
            display: block;
        }
        
        .buzz-results-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            z-index: 20;
            min-width: 300px;
        }
        
        .buzz-winner-text {
            font-size: 1.3em;
            color: #4CAF50;
            font-weight: bold;
        }
        
        .countdown-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 193, 7, 0.3);
            border: 2px solid #FFC107;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            z-index: 20;
            min-width: 300px;
        }
        
        .countdown-timer {
            font-size: 4em;
            color: #FFC107;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .countdown-text {
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #FFC107;
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connection-status">Connecting...</div>
    
    <div class="game-container">
        <div class="header">
            <h1 class="title" id="game-title">FAMILY FEUD</h1>
        </div>
        
        <!-- No Questions State -->
        <div class="no-questions" id="no-questions">
            <div class="no-questions-icon">🎯</div>
            <div>Waiting for questions...</div>
        </div>
        
        <!-- Game Board (hidden until questions loaded) -->
        <div class="game-board" id="game-board">
            <!-- Team Score Boxes -->
            <div class="scores">
                <div class="team-score" id="team1-score-box">
                    <div class="team-name" id="team1-display-name">TEAM 1</div>
                    <div class="score-value" id="team1-score">0</div>
                    <div class="team-strikes empty" id="team1-strikes">
                        <span class="strikes-text" id="team1-strikes-text">❌❌❌</span>
                    </div>
                </div>
                <div class="team-score" id="team2-score-box">
                    <div class="team-name" id="team2-display-name">TEAM 2</div>
                    <div class="score-value" id="team2-score">0</div>
                    <div class="team-strikes empty" id="team2-strikes">
                        <span class="strikes-text" id="team2-strikes-text">❌❌❌</span>
                    </div>
                </div>
            </div>

            <!-- Countdown Display -->
            <div class="countdown-display" id="countdown-display" style="display: none;">
                <div class="countdown-text">Get Ready!</div>
                <div class="countdown-timer" id="countdown-timer">3</div>
            </div>
            
            <!-- Buzz Results -->
            <div class="buzz-results-display" id="buzz-results" style="display: none;">
                <div class="buzz-winner-text" id="buzz-winner">Team 1 buzzed first!</div>
            </div>
            
            <div class="question" id="current-question">Loading...</div>
            
            <div class="answers-board" id="answers-board">
                <!-- Answers will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBI0FZRNrYyCjVWic6YEMmZ_bbHE4IAhcY",
            authDomain: "resident-family-feud.firebaseapp.com",
            databaseURL: "https://resident-family-feud-default-rtdb.firebaseio.com",
            projectId: "resident-family-feud",
            storageBucket: "resident-family-feud.firebasestorage.app",
            messagingSenderId: "895685579158",
            appId: "1:895685579158:web:1267859ee412bfe453cdb7"
        };

        // Initialize Firebase
        let database;
        let isConnected = false;
        
        try {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            
            // Monitor connection status
            const connectedRef = database.ref(".info/connected");
            connectedRef.on("value", (snap) => {
                isConnected = snap.val();
                updateConnectionStatus();
            });
            
            console.log("Firebase initialized");
        } catch (error) {
            console.log("Firebase not configured, using local mode");
            updateConnectionStatus();
        }

        // DISPLAY STATE - minimal cached data for building UI
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let revealedAnswers = {};
        let currentPhase = 'setup';
        let countdownInterval = null;

        function updateConnectionStatus() {
            const statusEl = document.getElementById('connection-status');
            if (database && isConnected) {
                statusEl.textContent = 'Connected';
                statusEl.className = 'connection-status connected';
            } else if (database && !isConnected) {
                statusEl.textContent = 'Connecting...';
                statusEl.className = 'connection-status loading';
            } else {
                statusEl.textContent = 'Offline';
                statusEl.className = 'connection-status disconnected';
            }
        }

        function showGameBoard() {
            document.getElementById('no-questions').style.display = 'none';
            document.getElementById('game-board').classList.add('visible');
        }

        function hideGameBoard() {
            document.getElementById('no-questions').style.display = 'block';
            document.getElementById('game-board').classList.remove('visible');
        }

        function updateTeamColors(teams) {
            // Apply team colors from database to CSS custom properties
            const root = document.documentElement;
            
            if (teams.team1?.color) {
                root.style.setProperty('--team1-color', teams.team1.color);
            }
            if (teams.team1?.secondaryColor) {
                root.style.setProperty('--team1-secondary', teams.team1.secondaryColor);
            }
            if (teams.team2?.color) {
                root.style.setProperty('--team2-color', teams.team2.color);
            }
            if (teams.team2?.secondaryColor) {
                root.style.setProperty('--team2-secondary', teams.team2.secondaryColor);
            }
        }

        function rebuildAnswersBoard() {
            const answersBoard = document.getElementById('answers-board');
            answersBoard.innerHTML = '';
            
            if (!currentQuestions[currentQuestionIndex] || !currentQuestions[currentQuestionIndex].answers) {
                return;
            }
            
            const currentQ = currentQuestions[currentQuestionIndex];
            
            // Set CSS custom property for grid rows
            answersBoard.style.setProperty('--answer-count', currentQ.answers.length);
            
            currentQ.answers.forEach((answer, index) => {
                const answerSlot = document.createElement('div');
                const key = `q${currentQuestionIndex}_a${index}`;
                const isRevealed = revealedAnswers[key] || false;
                
                answerSlot.className = `answer-slot ${isRevealed ? '' : 'hidden'}`;
                answerSlot.innerHTML = `
                    <div class="answer-rank">${answer.rank || (index + 1)}</div>
                    <div class="answer-text">${answer.text || 'Unknown Answer'}</div>
                    <div class="answer-points">${answer.points || 0}</div>
                `;
                
                answersBoard.appendChild(answerSlot);
            });
            
            // Apply dynamic font sizing based on answer count
            setTimeout(() => {
                applyDynamicSizing();
            }, 10);
        }
        
        function updateTeamColors(teams) {
            // Apply team colors from database to CSS custom properties
            const root = document.documentElement;
            
            if (teams.team1?.color) {
                root.style.setProperty('--team1-color', teams.team1.color);
            }
            if (teams.team1?.secondaryColor) {
                root.style.setProperty('--team1-secondary', teams.team1.secondaryColor);
            }
            if (teams.team2?.color) {
                root.style.setProperty('--team2-color', teams.team2.color);
            }
            if (teams.team2?.secondaryColor) {
                root.style.setProperty('--team2-secondary', teams.team2.secondaryColor);
            }
            
            // Update team-specific glow effects with current colors
            updateTeamGlowEffects();
        }
        
        function updateTeamGlowEffects() {
            // Get current colors from CSS custom properties
            const team1Color = getComputedStyle(document.documentElement).getPropertyValue('--team1-color').trim();
            const team2Color = getComputedStyle(document.documentElement).getPropertyValue('--team2-color').trim();
            
            // Parse RGB values for glow effects (simplified - assumes hex colors)
            const team1Rgb = hexToRgb(team1Color);
            const team2Rgb = hexToRgb(team2Color);
            
            if (team1Rgb) {
                const team1Box = document.getElementById('team1-score-box');
                const team1Name = team1Box.querySelector('.team-name');
                team1Box.style.boxShadow = `0 8px 32px rgba(0,0,0,0.3), 0 0 15px rgba(${team1Rgb.r}, ${team1Rgb.g}, ${team1Rgb.b}, 0.3)`;
                team1Name.style.textShadow = `0 0 8px rgba(${team1Rgb.r}, ${team1Rgb.g}, ${team1Rgb.b}, 0.5)`;
            }
            
            if (team2Rgb) {
                const team2Box = document.getElementById('team2-score-box');
                const team2Name = team2Box.querySelector('.team-name');
                team2Box.style.boxShadow = `0 8px 32px rgba(0,0,0,0.3), 0 0 15px rgba(${team2Rgb.r}, ${team2Rgb.g}, ${team2Rgb.b}, 0.3)`;
                team2Name.style.textShadow = `0 0 8px rgba(${team2Rgb.r}, ${team2Rgb.g}, ${team2Rgb.b}, 0.5)`;
            }
            
            // Apply controlling team effects
            updateControllingTeamEffects();
        }
        
        function updateControllingTeamEffects() {
            // Remove controlling team effects from both teams first
            const team1Box = document.getElementById('team1-score-box');
            const team2Box = document.getElementById('team2-score-box');
            
            team1Box.classList.remove('controlling-team');
            team2Box.classList.remove('controlling-team');
            
            // Apply controlling team effects if there's an active controlling team
            if (currentControllingTeam) {
                const controllingBox = document.getElementById(`team${currentControllingTeam}-score-box`);
                controllingBox.classList.add('controlling-team');
                
                // Get the team's color for enhanced effects
                const teamColor = getComputedStyle(document.documentElement)
                    .getPropertyValue(`--team${currentControllingTeam}-color`).trim();
                const teamRgb = hexToRgb(teamColor);
                
                if (teamRgb) {
                    // Enhanced glow for controlling team
                    controllingBox.style.boxShadow = `
                        0 8px 32px rgba(0,0,0,0.3), 
                        0 0 25px rgba(${teamRgb.r}, ${teamRgb.g}, ${teamRgb.b}, 0.6),
                        0 0 40px rgba(${teamRgb.r}, ${teamRgb.g}, ${teamRgb.b}, 0.4),
                        inset 0 0 20px rgba(${teamRgb.r}, ${teamRgb.g}, ${teamRgb.b}, 0.1)
                    `;
                    
                    // Enhanced border for controlling team
                    controllingBox.style.borderColor = teamColor;
                    controllingBox.style.borderWidth = '3px';
                }
            }
        }
        
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function applyDynamicSizing() {
            // Dynamic question sizing
            const questionEl = document.getElementById('current-question');
            const questionText = questionEl.textContent;
            const questionLength = questionText.length;
            
            questionEl.className = 'question';
            if (questionLength < 50) {
                questionEl.classList.add('short');
            } else if (questionLength < 100) {
                questionEl.classList.add('medium');
            } else {
                questionEl.classList.add('long');
            }
            
            // Dynamic font sizing for answers based on count (CSS Grid handles heights)
            const answerSlots = document.querySelectorAll('.answer-slot');
            if (answerSlots.length === 0) return;
            
            // Calculate font size based on number of answers
            let baseFontSize;
            if (answerSlots.length <= 6) {
                baseFontSize = 1.5; // Comfortable size for few answers
            } else if (answerSlots.length <= 12) {
                baseFontSize = 1.2; // Medium size for moderate count
            } else {
                baseFontSize = 1.0; // Smaller size for many answers
            }
            
            // Apply font sizing to all slots
            answerSlots.forEach(slot => {
                const answerText = slot.querySelector('.answer-text')?.textContent || '';
                const answerLength = answerText.length;
                
                // Adjust font size slightly based on text length
                let fontSize = baseFontSize;
                if (answerLength < 20) {
                    fontSize *= 1.1; // Slightly larger for short text
                } else if (answerLength >= 40) {
                    fontSize *= 0.9; // Slightly smaller for long text
                }
                
                // Ensure minimum readability
                fontSize = Math.max(0.8, fontSize);
                
                // Apply font size and clear any previous inline styles
                slot.style.fontSize = `${fontSize}em`;
                slot.style.minHeight = '';
                slot.style.marginTop = '';
                slot.style.marginBottom = '';
                
                // Remove old size classes
                slot.classList.remove('short', 'medium', 'long', 'small', 'large');
            });
        }

        function initializeGame() {
            if (!database) {
                hideGameBoard();
                return;
            }

            // Listen for question set changes - show/hide game board
            database.ref('questionSet').on('value', (snapshot) => {
                if (snapshot.exists() && snapshot.val().questions && snapshot.val().questions.length > 0) {
                    const questionSet = snapshot.val();
                    currentQuestions = questionSet.questions;
                    
                    // Update the game title
                    const titleElement = document.getElementById('game-title');
                    if (questionSet.name) {
                        titleElement.textContent = questionSet.name.toUpperCase();
                    } else {
                        titleElement.textContent = 'FAMILY FEUD';
                    }
                    
                    showGameBoard();
                    rebuildAnswersBoard();
                } else {
                    currentQuestions = [];
                    document.getElementById('game-title').textContent = 'FAMILY FEUD';
                    hideGameBoard();
                }
            });

            // DIRECT FIREBASE-TO-DOM UPDATES - no local state management

            // Current question index and text
            database.ref('gameState/currentQuestion').on('value', (snapshot) => {
                currentQuestionIndex = snapshot.val() || 0;
                const questionText = currentQuestions[currentQuestionIndex]?.question || 'Loading...';
                document.getElementById('current-question').textContent = questionText;
                applyDynamicSizing(); // Apply dynamic sizing after text update
                rebuildAnswersBoard(); // Rebuild when question changes
            });

            // Revealed answers
            database.ref('gameState/revealedAnswers').on('value', (snapshot) => {
                revealedAnswers = snapshot.val() || {};
                rebuildAnswersBoard(); // Rebuild when answers change
            });

            // Team names
            database.ref('teams/team1/name').on('value', (snapshot) => {
                document.getElementById('team1-display-name').textContent = snapshot.val() || 'TEAM 1';
            });
            
            database.ref('teams/team2/name').on('value', (snapshot) => {
                document.getElementById('team2-display-name').textContent = snapshot.val() || 'TEAM 2';
            });
            
            // Listen for complete teams data to handle colors
            database.ref('teams').on('value', (snapshot) => {
                const teams = snapshot.exists() ? snapshot.val() : { team1: null, team2: null };
                updateTeamColors(teams);
            });

            // Scores
            database.ref('gameState/team1Score').on('value', (snapshot) => {
                document.getElementById('team1-score').textContent = snapshot.val() || 0;
            });
            
            database.ref('gameState/team2Score').on('value', (snapshot) => {
                document.getElementById('team2-score').textContent = snapshot.val() || 0;
            });

            // Game phase for question visibility
            database.ref('gameState/phase').on('value', (snapshot) => {
                const phase = snapshot.val() || 'setup';
                currentPhase = phase;
                updateQuestionVisibility(phase);
            });

            // Buzzer results
            database.ref('buzzer/firstBuzz').on('value', (snapshot) => {
                if (snapshot.exists()) {
                    const buzz = snapshot.val();
                    showBuzzResults(buzz);
                } else {
                    hideBuzzResults();
                }
            });

            // Strikes display
            database.ref('gameState/strikes').on('value', (snapshot) => {
                const strikes = snapshot.val() || 0;
                updateStrikesDisplay(strikes);
            });

            // Controlling team (for strikes display and visual effects)
            database.ref('buzzer/controllingTeam').on('value', (snapshot) => {
                const controllingTeam = snapshot.val();
                updateStrikesDisplay(null, controllingTeam);
                updateControllingTeamEffects(); // Add visual effects for controlling team
            });

            // Countdown
            database.ref('countdown').on('value', (snapshot) => {
                if (snapshot.exists() && snapshot.val().active) {
                    showCountdown(snapshot.val().timeLeft);
                } else {
                    hideCountdown();
                }
            });
        }

        function updateQuestionVisibility(phase) {
            const questionElement = document.getElementById('current-question');
            
            // Hide question during registration, setup and countdown phases
            // Show question during buzzer_active, faceoff, main_game, steal, and round_over
            const shouldShowQuestion = phase === 'buzzer_active' || 
                                     phase === 'faceoff' || 
                                     phase === 'main_game' || 
                                     phase === 'steal' || 
                                     phase === 'round_over';
            
            if (shouldShowQuestion) {
                questionElement.style.display = 'grid';
            } else {
                questionElement.style.display = 'none';
            }
        }

        function showBuzzResults(buzz) {
            // Get team names directly from DOM (already updated by Firebase listeners)
            const team1Name = document.getElementById('team1-display-name').textContent;
            const team2Name = document.getElementById('team2-display-name').textContent;
            
            const winnerName = buzz.team === 1 ? team1Name : team2Name;
            document.getElementById('buzz-winner').textContent = `${winnerName} buzzed first!`;
            document.getElementById('buzz-results').style.display = 'block';
        }

        function hideBuzzResults() {
            document.getElementById('buzz-results').style.display = 'none';
        }

        // Keep track of strikes and controlling team for display
        let currentStrikes = 0;
        let currentControllingTeam = null;

        function updateStrikesDisplay(strikes, controllingTeam) {
            // Update stored values if provided
            if (strikes !== null && strikes !== undefined) currentStrikes = strikes;
            if (controllingTeam !== null && controllingTeam !== undefined) currentControllingTeam = controllingTeam;

            // Reset both teams to empty state
            document.getElementById('team1-strikes').className = 'team-strikes empty';
            document.getElementById('team2-strikes').className = 'team-strikes empty';
            document.getElementById('team1-strikes-text').textContent = '❌❌❌';
            document.getElementById('team2-strikes-text').textContent = '❌❌❌';

            if (currentStrikes > 0 && currentControllingTeam) {
                const strikeSymbols = '❌'.repeat(currentStrikes);
                const teamStrikesId = `team${currentControllingTeam}-strikes`;
                const teamStrikesTextId = `team${currentControllingTeam}-strikes-text`;
                
                // Show active strikes for controlling team
                document.getElementById(teamStrikesTextId).textContent = strikeSymbols;
                document.getElementById(teamStrikesId).className = 'team-strikes';
            }
        }

        function showCountdown(timeLeft) {
            hideCountdown(); // Clear any existing countdown
            
            document.getElementById('countdown-timer').textContent = timeLeft;
            document.getElementById('countdown-display').style.display = 'block';
            
            countdownInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('countdown-timer').textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    hideCountdown();
                }
            }, 1000);
        }

        function hideCountdown() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            document.getElementById('countdown-display').style.display = 'none';
        }

        // Initialize the game when page loads
        document.addEventListener('DOMContentLoaded', initializeGame);
        
        // Reapply dynamic sizing when window is resized
        window.addEventListener('resize', () => {
            // Debounce resize events to avoid excessive calculations
            clearTimeout(window.resizeTimeout);
            window.resizeTimeout = setTimeout(() => {
                applyDynamicSizing();
            }, 100);
        });
    </script>
</body>
</html>
